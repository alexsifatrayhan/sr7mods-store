    <style>
      /*
       * SR7MODS STORE - Cyberpunk & Glassmorphism Theme Style
       * Optimized CSS with custom CSS variables, smooth animations & 60fps transitions
       */

      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap');

      :root {
        --font-display: 'Rajdhani', sans-serif;
        --font-sans: 'Plus Jakarta Sans', sans-serif;

        /* Premium Cyberpunk Color Tokens */
        --color-bg-dark: #0a0c10;
        --color-bg-slate: #0f131a;
        --color-neon-cyan: #00f2fe;
        --color-neon-cyan-glow: rgba(0, 242, 254, 0.4);
        --color-neon-pink: #ff007f;
        --color-neon-pink-glow: rgba(255, 0, 127, 0.4);
        --color-neon-green: #39ff14;
        --color-neon-green-glow: rgba(57, 255, 20, 0.4);
        --color-gold: #ffb800;

        /* Glassmorphism Configuration */
        --glass-bg: rgba(15, 20, 30, 0.45);
        --glass-bg-hover: rgba(25, 32, 47, 0.65);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-border-glow: rgba(0, 242, 254, 0.25);
        --glass-blur: blur(16px) saturate(180%);
      }

      /* Base resets & layouts */
      body {
        background-color: var(--color-bg-dark);
        font-family: var(--font-sans);
        color: #e2e8f0;
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
      }

      /* Background Glowing Blobs */
      .bg-glow-blobs {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -10;
        pointer-events: none;
        overflow: hidden;
      }

      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.25;
        animation: floatBlobs 20s infinite ease-in-out;
      }

      .blob-1 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, var(--color-neon-cyan) 0%, rgba(0,0,0,0) 70%);
        top: -10%;
        left: -10%;
        animation-delay: 0s;
      }

      .blob-2 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, var(--color-neon-pink) 0%, rgba(0,0,0,0) 70%);
        bottom: -15%;
        right: -10%;
        animation-delay: 5s;
      }

      .blob-3 {
        width: 450px;
        height: 450px;
        background: radial-gradient(circle, var(--color-neon-green) 0%, rgba(0,0,0,0) 70%);
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 10s;
      }

      @keyframes floatBlobs {
        0%, 100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(50px, -40px) scale(1.1);
        }
        66% {
          transform: translate(-30px, 60px) scale(0.95);
        }
      }

      /* Typography styles */
      .font-display {
        font-family: var(--font-display);
      }

      .text-cyber-glow-cyan {
        text-shadow: 0 0 8px var(--color-neon-cyan-glow), 0 0 20px rgba(0, 242, 254, 0.2);
      }

      .text-cyber-glow-pink {
        text-shadow: 0 0 8px var(--color-neon-pink-glow), 0 0 20px rgba(255, 0, 127, 0.2);
      }

      /* Glassmorphism base utility classes */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      .glass-panel:hover {
        border-color: rgba(255, 255, 255, 0.15);
      }

      .glass-card-interactive {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                    border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card-interactive:hover {
        transform: translateY(-4px) scale(1.02);
        border-color: var(--glass-border-glow);
        background-color: var(--glass-bg-hover);
        box-shadow: 0 12px 40px 0 rgba(0, 242, 254, 0.15);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(10, 12, 16, 0.5);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-neon-cyan);
        box-shadow: 0 0 8px var(--color-neon-cyan-glow);
      }

      /* Hamburger & Sidebar Transition */
      .hamburger-line {
        transition: transform 0.3s ease, opacity 0.3s ease, background-color 0.3s ease;
      }

      .sidebar-open .line-1 {
        transform: translateY(6px) rotate(45deg);
      }

      .sidebar-open .line-2 {
        opacity: 0;
      }

      .sidebar-open .line-3 {
        transform: translateY(-6px) rotate(-45deg);
      }

      /* Infinite Carousel */
      .carousel-viewport {
        overflow: hidden;
        position: relative;
        width: 100%;
        cursor: grab;
        user-select: none;
      }

      .carousel-viewport:active {
        cursor: grabbing;
      }

      .carousel-track {
        display: flex;
        transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        will-change: transform;
      }

      /* Neon Glow utilities */
      .glow-border-cyan {
        border-color: var(--color-neon-cyan);
        box-shadow: 0 0 10px var(--color-neon-cyan-glow);
      }

      .glow-border-pink {
        border-color: var(--color-neon-pink);

      /* Fixed Accessibility Gear Button */
      #secret-trigger-gear {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 48px;
        height: 48px;
        background: rgba(15, 20, 30, 0.55);
        backdrop-filter: blur(12px) saturate(180%);
        -webkit-backdrop-filter: blur(12px) saturate(180%);
        border: 1px solid rgba(0, 242, 254, 0.3);
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #00f2fe;
        font-size: 20px;
        cursor: pointer;
        z-index: 9999;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #secret-trigger-gear:hover {
        transform: rotate(45deg) scale(1.1);
        box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
        border-color: rgba(0, 242, 254, 0.6);
        background: rgba(15, 20, 30, 0.8);
      }

      /* Accessibility side drawer panel style */
      #accessibility-sidebar {
        position: fixed;
        top: 0;
        right: -320px;
        width: 320px;
        height: 100vh;
        z-index: 10000;
        transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }

      #accessibility-sidebar.open {
        right: 0;
      }

      body.light-theme #accessibility-sidebar {
        border-left: 1px solid rgba(0, 0, 0, 0.08);
      }

      /* Light/Brighten Glassy UI Theme Overrides */
      body.light-theme {
        --color-bg-dark: #f1f3f7;
        --color-bg-slate: #ebedf2;
        --glass-bg: rgba(255, 255, 255, 0.55);
        --glass-bg-hover: rgba(255, 255, 255, 0.75);
        --glass-border: rgba(0, 0, 0, 0.1);
        --glass-border-glow: rgba(0, 159, 169, 0.3);

        color: #1e293b;
      }

      body.light-theme .glass-panel,
      body.light-theme .glass-card-interactive,
      body.light-theme .glass-card {
        background: var(--glass-bg);
        border-color: var(--glass-border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        color: #0f172a;
      }

      body.light-theme .glass-card-interactive:hover {
        background-color: var(--glass-bg-hover);
        border-color: var(--glass-border-glow);
        box-shadow: 0 12px 40px 0 rgba(0, 159, 169, 0.15);

      body.light-theme text,

      body.light-theme h2,
      body.light-theme h3,
      body.light-theme h4,
      body.light-theme h5,

      }

        color: #0f172a !important;

      body.light-theme .text-gray-300,
      body.light-theme .text-gray-400,
      body.light-theme .text-slate-300,

      }

      body.light-theme .border-white\/5,
      body.light-theme .border-white\/10 {
        border-color: rgba(0, 0, 0, 0.08) !important;
      }

      body.light-theme .bg-black\/40,

      body.light-theme .bg-black\/80,

      body.light-theme .bg-\[\#0a0c10\],

      body.light-theme .text-cyan-400 {

      }

      body.light-theme .text-cyber-glow-cyan {
        text-shadow: 0 0 8px rgba(0, 129, 167, 0.25);
      }

      body.light-theme .text-pink-500,
      body.light-theme .text-pink-400 {

      body.light-theme input,

        background: rgba(255, 255, 255, 0.8) !important;

      body.light-theme input:focus {

      body.light-theme .blob-1 {
        background: radial-gradient(circle, rgba(0, 129, 167, 0.15) 0%, rgba(255,255,255,0) 70%) !important;
      }

      body.light-theme .blob-2 {
        background: radial-gradient(circle, rgba(217, 4, 41, 0.1) 0%, rgba(255,255,255,0) 70%) !important;
      }

      body.light-theme .blob-3 {
        background: radial-gradient(circle, rgba(57, 255, 20, 0.08) 0%, rgba(255,255,255,0) 70%) !important;
      }

      /* Dynamic glow cards depending on profile */
      .glow-card-cyan {
        box-shadow: 0 8px 32px 0 rgba(0, 242, 254, 0.08);
      }
      .glow-card-pink {
        box-shadow: 0 8px 32px 0 rgba(255, 0, 127, 0.08);

      .glow-card-green {

      /* Input Styles */
      input, textarea, select {
        background: rgba(10, 12, 16, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f8fafc;
        transition: all 0.25s ease;
      }

      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--color-neon-cyan);
        box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.25);

      /* Buttons */
      .btn-primary {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        color: #030712;
        font-weight: 600;
        letter-spacing: 0.05em;
        transition: all 0.3s ease;

      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);

      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #e2e8f0;
        transition: all 0.3s ease;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
      }

      /* Custom Accordion for Sidebar */
      .accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
      }

      .accordion-active .accordion-content {
        max-height: 500px;
      }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>

    <!-- App Detail Render Engine Script inline -->
    <script>
      (function() {
        let storeDB = null;

        document.addEventListener('DOMContentLoaded', async () => {
          await initializeApp();
        });

        async function initializeApp() {
          storeDB = await fetchDatabase();
          setupGlobalNavigation();
          renderSidebarCategories();
          renderAppDetails();
          updateStoreConfigUI();
        }

         async function fetchDatabase() {
          try {
            const response = await fetch(`./storedetails.json?t=${Date.now()}`);
            if (response.ok) {
              const dataText = await response.text();
              localStorage.setItem('sr7_storedetails', dataText);
              return JSON.parse(dataText);
            }
          } catch (error) {
            console.error('Could not fetch storedetails.json, checking fallback cache', error);
          }

          let localData = localStorage.getItem('sr7_storedetails');
          if (localData) {
            try {
              return JSON.parse(localData);
            } catch (e) {
              console.error('Error parsing localStorage storedetails', e);
            }
          }
          return null;
        }

        function updateStoreConfigUI() {
          if (!storeDB || !storeDB.config) return;
          const storeNameText = storeDB.config.store_name || "SR7MODS STORE";
          const storeTitles = document.querySelectorAll('.store-title-header');
          storeTitles.forEach(el => {
            el.textContent = storeNameText;
          });
        }

        function setupGlobalNavigation() {
          const burgerBtn = document.getElementById('burger-menu-btn');
          const sidebar = document.getElementById('sidebar-nav');
          const sidebarOverlay = document.getElementById('sidebar-overlay');
          
          if (burgerBtn && sidebar && sidebarOverlay) {
            burgerBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              const isOpen = sidebar.classList.contains('translate-x-0');
              if (isOpen) {
                closeSidebar();
              } else {
                openSidebar();
              }
            });

            sidebarOverlay.addEventListener('click', closeSidebar);
          }

          document.addEventListener('click', (e) => {
            if (sidebar && !sidebar.contains(e.target) && burgerBtn && !burgerBtn.contains(e.target)) {
              if (sidebar.classList.contains('translate-x-0')) {
                closeSidebar();
              }
            }
          });

          const homeTitle = document.getElementById('header-home-link');
          if (homeTitle) {
            homeTitle.addEventListener('click', (e) => {
              e.preventDefault();
              window.location.href = 'index.html';
            });
          }

          const aboutLink = document.getElementById('header-about-link');
          if (aboutLink) {
            aboutLink.addEventListener('click', (e) => {
              e.preventDefault();
              const targetUrl = storeDB?.config?.about_url || 'https://alexsifatrayhan.github.io/about-me/';
              window.location.href = targetUrl;
            });
          }

          const sidebarHome = document.getElementById('sidebar-home-link');
          if (sidebarHome) {
            sidebarHome.addEventListener('click', (e) => {
              e.preventDefault();
              closeSidebar();
              window.location.href = 'index.html';
            });
          }

          const sidebarAbout = document.getElementById('sidebar-about-link');
          if (sidebarAbout) {
            sidebarAbout.addEventListener('click', (e) => {
              e.preventDefault();
              closeSidebar();
              const targetUrl = storeDB?.config?.about_url || 'https://alexsifatrayhan.github.io/about-me/';
              window.location.href = targetUrl;
            });
          }
        }

        function openSidebar() {
          const burgerBtn = document.getElementById('burger-menu-btn');
          const sidebar = document.getElementById('sidebar-nav');
          const sidebarOverlay = document.getElementById('sidebar-overlay');
          
          if (sidebar && sidebarOverlay && burgerBtn) {
            sidebar.classList.remove('-translate-x-full');
            sidebar.classList.add('translate-x-0');
            sidebarOverlay.classList.remove('hidden', 'pointer-events-none');
            sidebarOverlay.classList.add('opacity-100');
            burgerBtn.classList.add('sidebar-open');
          }
        }

        function closeSidebar() {
          const burgerBtn = document.getElementById('burger-menu-btn');

            sidebar.classList.add('-translate-x-full');
            sidebar.classList.remove('translate-x-0');
            sidebarOverlay.classList.remove('opacity-100');
            sidebarOverlay.classList.add('hidden', 'pointer-events-none');

          const accordionContainer = document.getElementById('sidebar-categories-accordion');

        function renderAppDetails() {
          const container = document.getElementById('app-detail-container');
          if (!container || !storeDB) return;

          const urlParams = new URLSearchParams(window.location.search);
          const pkg = urlParams.get('pkg');

          if (!pkg) {
            container.innerHTML = `
              <div class="glass-panel p-8 text-center rounded-2xl">
                <p class="text-rose-500 font-mono text-lg uppercase">[ RUNTIME ERROR: NO SYSTEM REPOSITORY SELECTED ]</p>
                <button onclick="window.location.href='index.html'" class="btn-primary px-6 py-2 rounded-xl mt-4">BACK TO CORE HUB</button>
              </div>

            return;
          }

          const app = storeDB.app_list.find(a => a.pkg === pkg);

          if (!app) {
            container.innerHTML = `
              <div class="glass-panel p-8 text-center rounded-2xl">
                <p class="text-rose-500 font-mono text-lg uppercase">[ ARCHIVE CRITICAL FAILURE: SYSTEM DATA CORRUPTED OR EMPTY ]</p>
                <p class="text-xs text-gray-400 mt-2 font-mono">The packet index matches no registered dynamic payload.</p>
                <button onclick="window.location.href='index.html'" class="btn-primary px-6 py-2 rounded-xl mt-4">BACK TO CORE HUB</button>
              </div>
            `;
            return;
          }

          document.title = `${app.name.toUpperCase()} - SR7MODS STORE`;

          let categoryObj = storeDB.categories.find(c => c.id === app.category);
          let categoryName = categoryObj ? categoryObj.name : app.category;

          // Theme elements
          let themeColorClass = 'text-cyan-400';
          let borderGlowClass = 'glow-card-cyan';
          if (app.category === 'gaming') {
            themeColorClass = 'text-pink-400';
            borderGlowClass = 'glow-card-pink';
          } else if (app.category === 'media') {
            themeColorClass = 'text-emerald-400';
            borderGlowClass = 'glow-card-green';
          }

          // Features Html List
          const featuresHtml = app.mod_features.map(feat => `
            <li class="flex items-start gap-3 text-sm md:text-base text-gray-200">
              <span class="text-cyan-400 font-mono">⚡</span>
              <span>${feat}</span>
            </li>
          `).join('');

          // Download Links Html List
          const downloadsHtml = app.download_links.map(link => `
            <a href="${link.url}" target="_blank" class="btn-primary py-3 px-6 rounded-xl font-mono text-sm uppercase text-center tracking-wider flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
              </svg>
              ${link.name.toUpperCase()}
            </a>
          `).join('');

          // Play Store redirect block
          let storeRefHtml = '';
          if (app.store_ref && app.store_ref.url && app.store_ref.url !== '#') {
            const logoText = app.store_ref.logo_type === 'play_store' ? 'Google Play Store' : 'App Store';
            storeRefHtml = `
              <div class="border-t border-white/5 pt-4">
                <p class="text-xs text-gray-500 font-mono mb-2 uppercase">Official Software Reference:</p>
                <a href="${app.store_ref.url}" target="_blank" class="inline-flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded-xl text-xs text-gray-300 hover:text-white transition-all font-mono">
                  <span>🌐</span> ${app.store_ref.display_name || logoText}
                </a>
              </div>
            `;
          }

          container.innerHTML = `
            <!-- Top App Detail Header Info -->
            <div class="glass-panel p-6 md:p-8 rounded-2xl flex flex-col md:flex-row items-center md:items-start gap-6 md:gap-8 ${borderGlowClass}">
              <img src="${app.icon}" alt="${app.name}" class="w-24 h-24 md:w-32 md:h-32 rounded-2xl object-cover border border-white/10" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=120&h=120&q=80'">
              
              <div class="flex-grow space-y-4 w-full text-center md:text-left">
                <div class="space-y-1">
                  <span class="text-xs tracking-widest uppercase bg-white/5 border border-white/10 px-3 py-1 rounded-full text-gray-400 font-mono inline-block">
                    ${categoryName.toUpperCase()}
                  </span>
                  <h1 class="font-display text-3xl md:text-4xl font-extrabold text-white leading-tight uppercase tracking-wider">
                    ${app.name}
                  </h1>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-black/30 p-3 rounded-xl border border-white/5 text-xs font-mono">
                  <div>
                    <span class="text-gray-500 block uppercase">Package ID</span>
                    <span class="text-cyan-400 truncate block">${app.pkg}</span>
                  </div>
                  <div>
                    <span class="text-gray-500 block uppercase">Version</span>
                    <span class="text-white block">${app.version}</span>
                  </div>
                  <div>
                    <span class="text-gray-500 block uppercase">Original Creator</span>
                    <span class="text-white block">${app.creator || 'N/A'}</span>
                  </div>
                  <div>
                    <span class="text-gray-500 block uppercase">Mod Developer</span>
                    <span class="text-pink-400 block font-bold">${app.modder || 'SR7 Mods'}</span>
                  </div>

              </div>
            </div>

            <!-- Main App Body Blocks -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
              
              <!-- Left Col: Mod Features, Description -->
              <div class="md:col-span-2 space-y-8">
                <!-- 1. Modification Features Box -->
                <div class="glass-panel p-6 rounded-2xl space-y-4">
                  <h2 class="font-display text-xl font-bold tracking-wider text-pink-500 text-cyber-glow-pink uppercase flex items-center gap-2">
                    <span>⚡</span> SYSTEM OVERRIDE INJECTIONS
                  </h2>
                  <ul class="space-y-3 pl-1">
                    ${featuresHtml}

                </div>

                <!-- 2. Rich Text Info Description Box -->
                <div class="glass-panel p-6 rounded-2xl space-y-4">
                  <h2 class="font-display text-xl font-bold tracking-wider text-cyan-400 text-cyber-glow-cyan uppercase flex items-center gap-2">
                    <span>📖</span> SYSTEM INTEL REPORT
                  </h2>
                  <div class="text-sm text-gray-300 leading-relaxed space-y-3 prose prose-invert font-sans">
                    ${app.description}

              </div>

              <!-- Right Col: Download Options -->
              <div class="space-y-6">
                <div class="glass-panel p-6 rounded-2xl space-y-6">
                  <div class="text-center md:text-left">
                    <h2 class="font-display text-xl font-bold tracking-wider text-white uppercase mb-1">DOWNLOAD SECURE LOADS</h2>
                    <p class="text-[10px] text-gray-500 font-mono uppercase">Direct APK Overrides</p>
                  </div>

                  <div class="flex flex-col gap-3">
                    ${downloadsHtml}
                  </div>

                  ${storeRefHtml}
                </div>

                <button onclick="window.location.href='index.html'" class="w-full btn-secondary py-3 px-6 rounded-xl font-mono text-xs uppercase tracking-wider">
                  &lt; BACK TO REPOSITORY INDEX
                </button>
              </div>

            </div>
          `;
        }
      })();
    </script>

    <!-- Accessibility Settings script inline -->
    <script>
      (function () {
        document.addEventListener('DOMContentLoaded', () => {
          initBackdoor();
          applyInitialTheme();
        });

        function applyInitialTheme() {
          const savedTheme = localStorage.getItem('theme') || 'dark';
          if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
          } else {
            document.body.classList.remove('light-theme');
          }
        }

        function initBackdoor() {
          let gear = document.getElementById('secret-trigger-gear');
          if (!gear) {
            const footer = document.querySelector('footer');
            if (footer) {
              gear = document.createElement('button');
              gear.id = 'secret-trigger-gear';
              gear.innerHTML = '⚙️';
              gear.title = 'Accessibility Settings';
              footer.appendChild(gear);
            }
          }

          // Create the Accessibility Sidebar if it doesn't exist
          let sidebar = document.getElementById('accessibility-sidebar');
          if (!sidebar) {
            sidebar = document.createElement('div');
            sidebar.id = 'accessibility-sidebar';
            sidebar.className = 'glass-panel';
            sidebar.innerHTML = `
              <!-- Drawer Header -->
              <div class="p-4 border-b border-white/10 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-[#00f2fe] text-lg">⚙️</span>
                  <h3 class="font-display font-bold text-lg tracking-wider text-white uppercase">Accessibility</h3>
                </div>
                <button id="close-accessibility-btn" class="text-gray-400 hover:text-white transition-colors text-lg p-2 font-bold">&times;</button>
              </div>
              
              <!-- Drawer Body -->
              <div class="p-5 flex-1 flex flex-col justify-between" style="height: calc(100% - 60px);">
                <!-- Top Settings Group -->
                <div class="space-y-6">
                  <div class="flex items-center justify-between bg-black/20 p-4 rounded-lg border border-white/5">
                    <div>
                      <label class="text-sm font-semibold tracking-wide text-white block">Dark Mode</label>
                      <span class="text-[10px] text-gray-400 font-mono">Toggle deep space background</span>
                    </div>
                    <!-- Toggle Switch -->
                    <label class="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" id="dark-mode-toggle" class="sr-only peer" checked>
                      <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-cyan-500"></div>
                    </label>
                  </div>
                </div>
              </div>
            `;
            document.body.appendChild(sidebar);
          }

          // Initial check state for dark mode toggle
          const toggleInput = document.getElementById('dark-mode-toggle');
          if (toggleInput) {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            toggleInput.checked = (savedTheme !== 'light');
            toggleInput.addEventListener('change', (e) => {
              if (e.target.checked) {
                localStorage.setItem('theme', 'dark');
                document.body.classList.remove('light-theme');
              } else {
                localStorage.setItem('theme', 'light');
                document.body.classList.add('light-theme');
              }
            });
          }

          // Toggle drawer on gear click
          if (gear) {
            gear.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();
              sidebar.classList.toggle('open');
            });
          }

          // Close drawer on close click
          const closeBtn = document.getElementById('close-accessibility-btn');
          if (closeBtn) {
            closeBtn.addEventListener('click', () => {
              sidebar.classList.remove('open');
            });
          }

          // Close drawer on click outside
          document.addEventListener('click', (e) => {
            if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target !== gear) {
              sidebar.classList.remove('open');
            }
          });
        }
      })();
    </script>
  </body>
</html>
