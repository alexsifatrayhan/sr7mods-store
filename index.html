<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="store-meta-title">SR7MODS STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap');

      :root {
        --font-display: 'Rajdhani', sans-serif;
        --font-sans: 'Plus Jakarta Sans', sans-serif;
        --color-bg-dark: #0a0c10;
        --color-bg-slate: #0f131a;
        --color-neon-cyan: #00f2fe;
        --color-neon-cyan-glow: rgba(0, 242, 254, 0.4);
        --color-neon-pink: #ff007f;
        --color-neon-pink-glow: rgba(255, 0, 127, 0.4);
        --glass-bg: rgba(15, 20, 30, 0.45);
        --glass-border: rgba(255, 255, 255, 0.06);
        --glass-blur: blur(12px) saturate(180%);
      }

      body {
        background-color: var(--color-bg-dark);
        font-family: var(--font-sans);
        color: #e2e8f0;
        overflow-x: hidden;
        transition: background-color 0.3s, color 0.3s;
      }

      .font-display { font-family: var(--font-display); }
      .text-cyber-glow-cyan { text-shadow: 0 0 8px var(--color-neon-cyan-glow), 0 0 20px rgba(0, 242, 254, 0.2); }
      .text-cyber-glow-pink { text-shadow: 0 0 8px var(--color-neon-pink-glow), 0 0 20px rgba(255, 0, 127, 0.2); }
      .glow-border-cyan:hover { box-shadow: 0 0 15px var(--color-neon-cyan-glow); border-color: var(--color-neon-cyan); }
      .glass-panel { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); }

      /* Carousel Smooth Engine */
      .carousel-viewport { overflow: hidden; position: relative; width: 100%; }
      .carousel-track { display: flex; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); width: 100%; }

      /* Interactive Cards Grid */
      .glass-card-interactive {
        background: rgba(15, 22, 36, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(8px);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .glass-card-interactive:hover {
        transform: translateY(-4px);
        background: rgba(20, 30, 50, 0.55);
        border-color: rgba(0, 242, 254, 0.25);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 15px rgba(0, 242, 254, 0.05);
      }

      /* Light Theme Overrides */
      body.light-theme {
        --color-bg-dark: #f4f6f9;
        --color-bg-slate: #ffffff;
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 0, 0, 0.08);
        color: #1e293b;
      }
      body.light-theme .glass-card-interactive {
        background: rgba(255, 255, 255, 0.8);
        border-color: rgba(0, 0, 0, 0.05);
      }
      body.light-theme .glass-card-interactive:hover {
        background: #ffffff;
        border-color: rgba(0, 242, 254, 0.5);
      }
      body.light-theme h1, body.light-theme h4, body.light-theme h3 { color: #0f172a; }

      /* Sidebar Navigation Matrix */
      #accessibility-sidebar {
        transform: translateX(-100%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 100;
      }
      #accessibility-sidebar.open { transform: translateX(0); }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
  </head>
  <body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500/30">

    <header class="glass-panel sticky top-0 z-40 border-b border-white/5 px-4 lg:px-8 py-4 backdrop-blur-md">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button id="burger-menu-btn" class="p-2 hover:bg-white/5 rounded-xl transition-colors lg:hidden">
            <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          <div class="flex flex-col">
            <h1 id="store-title" class="font-display text-2xl lg:text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 text-cyber-glow-cyan">SR7MODS STORE</h1>
            <p class="text-[10px] font-mono text-gray-500 tracking-widest uppercase">Nexus Operational Database</p>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <a id="header-about-link" href="#" target="_blank" class="hidden md:inline-block text-xs font-mono text-gray-400 hover:text-cyan-400 transition-colors">// REPO ACCESS</a>
          <button id="secret-trigger-gear" class="p-2.5 bg-white/5 hover:bg-cyan-500/10 border border-white/5 hover:border-cyan-500/30 rounded-xl transition-all duration-300 group">
            <svg class="w-4 h-4 text-cyan-400 group-hover:rotate-90 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 lg:px-8 py-6 space-y-8">
      
      <section class="carousel-viewport w-full rounded-3xl class-panel">
        <div id="hero-carousel-track" class="carousel-track">
          <div class="min-w-full p-8 text-center font-mono text-gray-500">INITIALIZING SECURE FEATURED MODULES...</div>
        </div>
      </section>

      <nav id="categories-filter-bar" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
        <button data-filter="all" class="px-5 py-2 rounded-xl text-xs font-mono uppercase tracking-wider border border-cyan-500/30 bg-cyan-500/20 text-cyan-400 transition-all shrink-0">
          [ ALL MATRIX ]
        </button>
        </nav>

      <section class="space-y-4">
        <div class="flex items-center justify-between border-b border-white/5 pb-2">
          <h2 class="font-display text-lg font-bold uppercase tracking-wider text-gray-400">// Core App Registry</h2>
          <span id="registry-count" class="text-xs font-mono text-cyan-500">0 Nodes Active</span>
        </div>
        <div id="apps-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
          </div>
      </section>

    </main>

    <div id="accessibility-sidebar" class="fixed top-0 left-0 h-full w-72 bg-slate-900/95 border-r border-white/10 p-6 flex flex-col justify-between shadow-2xl backdrop-blur-lg">
      <div class="space-y-6">
        <div class="flex items-center justify-between border-b border-white/10 pb-4">
          <h3 class="font-display text-xl font-bold text-pink-500 text-cyber-glow-pink">CORE OPTIONS</h3>
          <button id="close-accessibility-btn" class="text-gray-400 hover:text-white font-mono text-sm">[X]</button>
        </div>
        <div class="space-y-4">
          <div class="flex items-center justify-between p-3 bg-black/20 rounded-xl border border-white/5">
            <span class="text-xs font-mono text-gray-300">NEON MATRIX LIGHTS</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="dark-mode-toggle" checked class="sr-only peer">
              <div class="w-9 h-5 bg-gray-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-gray-400 after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500 peer-checked:after:bg-white"></div>
            </label>
          </div>
        </div>
      </div>
      <div class="border-t border-white/5 pt-4 text-center">
        <p class="text-[10px] font-mono text-gray-600">SR7 ENGINE ENGINE MANAGER v2.0</p>
      </div>
    </div>

    <footer class="glass-panel border-t border-white/5 py-4 px-4 m-4 rounded-2xl text-center">
      <p class="text-xs font-mono text-gray-500">&copy; 2026 <span class="text-cyan-400 font-bold">SR7 Mods</span>. Powered by Standing Dynamic JSON Architecture.</p>
    </footer>

    <script>
      (function () {
        let storeDB = null;
        const appGrid = document.getElementById('apps-grid');
        const heroCarouselTrack = document.getElementById('hero-carousel-track');
        const categoriesFilterBar = document.getElementById('categories-filter-bar');

        // Fetch Dynamic Repo Database
        async function loadRepositoryDatabase() {
          try {
            const response = await fetch('storedetails.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error('Network structure failure');
            storeDB = await response.json();
            
            // Apply configurations dynamically
            if(storeDB.config) {
              document.title = storeDB.config.store_name || "SR7MODS STORE";
              document.getElementById('store-title').innerText = storeDB.config.store_name || "SR7MODS STORE";
              document.getElementById('store-meta-title').innerText = storeDB.config.store_name || "SR7MODS STORE";
              document.getElementById('header-about-link').href = storeDB.config.about_url || "#";
            }

            // Fire up compilation units
            buildCategoryFiltersMatrix();
            initHeroCarouselFeatured();
            renderAppGridMatrix('all');

          } catch (error) {
            console.error('DATABASE ENGINE CRASH:', error);
            if(appGrid) {
              appGrid.innerHTML = `<div class="col-span-full text-center text-pink-500 font-mono py-12">DATABASE SYNCHRONIZATION INTERRUPTED [FAILED TO FETCH]</div>`;
            }
          }
        }

        // Build Navigation Category dynamically from JSON structure
        function buildCategoryFiltersMatrix() {
          if(!storeDB || !storeDB.categories || !categoriesFilterBar) return;
          
          // Clear any dynamic entries leaving only the initial [ALL MATRIX] button
          const allBtn = categoriesFilterBar.querySelector('[data-filter="all"]');
          categoriesFilterBar.innerHTML = '';
          categoriesFilterBar.appendChild(allBtn);

          storeDB.categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.setAttribute('data-filter', cat.id);
            btn.className = "px-5 py-2 rounded-xl text-xs font-mono uppercase tracking-wider border border-white/5 bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 hover:border-white/10 transition-all shrink-0";
            btn.innerText = cat.name;
            categoriesFilterBar.appendChild(btn);
          });

          setupCategoryFiltersClickHandlers();
        }

        // Render Hero Carousel ONLY with items present in recommended_apps array
        function initHeroCarouselFeatured() {
          if (!heroCarouselTrack || !storeDB || !storeDB.app_list || !storeDB.recommended_apps) return;
          heroCarouselTrack.innerHTML = '';
          
          // Filter to select only registered recommended nodes
          const featuredApps = storeDB.app_list.filter(app => storeDB.recommended_apps.includes(app.pkg));

          if(featuredApps.length === 0) {
            heroCarouselTrack.innerHTML = `
              <div class="min-w-full p-8 text-center font-mono text-gray-500">NO FEATURED NODE ALLOCATED IN REGISTERED STREAM</div>
            `;
            return;
          }

          featuredApps.forEach(app => {
            const slide = document.createElement('div');
            slide.className = 'carousel-slide min-w-full p-4 md:p-8';
            slide.innerHTML = `
              <div class="glass-panel rounded-3xl p-6 md:p-8 flex flex-col md:flex-row items-center gap-6 border border-cyan-500/20 relative overflow-hidden">
                <div class="absolute -right-16 -bottom-16 w-64 h-64 bg-gradient-to-tr from-cyan-500/10 to-blue-500/5 rounded-full blur-3xl pointer-events-none"></div>
                <img src="${app.icon}" alt="${app.name}" class="w-24 h-24 md:w-28 md:h-28 rounded-2xl object-cover border border-cyan-400/30 shadow-[0_0_15px_rgba(0,242,254,0.15)]">
                <div class="flex-1 text-center md:text-left space-y-2">
                  <span class="px-2.5 py-1 bg-cyan-500/10 border border-cyan-400/20 text-cyan-400 text-[10px] font-mono rounded-md uppercase tracking-wider">${app.category}</span>
                  <h3 class="font-display text-2xl md:text-3xl font-extrabold text-white tracking-wide">${app.name}</h3>
                  <p class="text-xs md:text-sm text-gray-400 line-clamp-2 max-w-2xl">${app.description ? app.description.replace(/<[^>]*>/g, '') : 'Premium system framework optimization node enabled.'}</p>
                  <div class="pt-2">
                    <a href="app.html?pkg=${app.pkg}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-500 text-black text-xs font-mono font-bold uppercase tracking-wider rounded-xl shadow-lg hover:shadow-cyan-500/20 transition-all transform hover:-translate-y-0.5">
                      Open Console Layer →
                    </a>
                  </div>
                </div>
              </div>
            `;
            heroCarouselTrack.appendChild(slide);
          });
        }

        // Render Application Registry Cards
        function renderAppGridMatrix(categoryFilter = 'all') {
          if (!appGrid || !storeDB || !storeDB.app_list) return;
          appGrid.innerHTML = '';

          const filteredApps = storeDB.app_list.filter(app => {
            return categoryFilter === 'all' || app.category.toLowerCase() === categoryFilter.toLowerCase();
          });

          document.getElementById('registry-count').innerText = `${filteredApps.length} Nodes Active`;

          if (filteredApps.length === 0) {
            appGrid.innerHTML = `<div class="col-span-full text-center text-gray-500 font-mono py-12">EMPTY DATASTACK ON THIS FILTER INTERFACE</div>`;
            return;
          }

          filteredApps.forEach(app => {
            const card = document.createElement('div');
            card.className = 'glass-card-interactive rounded-2xl p-5 flex flex-col justify-between relative group overflow-hidden animate-fade-in';
            
            // Format features loop inline text safely
            const featuresSnippet = app.mod_features && app.mod_features.length > 0 
              ? app.mod_features.join(' • ') 
              : (app.description ? app.description.replace(/<[^>]*>/g, '') : 'Premium configuration node ready.');

            card.innerHTML = `
              <div>
                <div class="flex items-start justify-between gap-4">
                  <img src="${app.icon}" alt="${app.name}" class="w-14 h-14 rounded-xl object-cover border border-white/10 group-hover:border-cyan-400/40 transition-all duration-300">
                  <span class="text-[9px] font-mono text-gray-400 bg-black/40 px-2 py-0.5 rounded border border-white/5">${app.version}</span>
                </div>
                <h4 class="font-display text-lg font-bold text-white mt-4 tracking-wide group-hover:text-cyan-400 transition-colors duration-300">${app.name}</h4>
                <p class="text-xs text-gray-400 mt-1 line-clamp-2 h-8 font-sans">${featuresSnippet}</p>
              </div>
              <div class="mt-5 pt-3 border-t border-white/5 flex items-center justify-between">
                <span class="text-[10px] font-mono text-cyan-400 uppercase tracking-widest bg-cyan-950/20 px-2 py-0.5 rounded border border-cyan-900/30">${app.category}</span>
                <a href="app.html?pkg=${app.pkg}" class="text-xs font-mono text-pink-500 group-hover:text-white flex items-center gap-1 transition-colors duration-300">
                  Inject <span class="transform group-hover:translate-x-1 transition-transform duration-300">→</span>
                </a>
              </div>
            `;
            appGrid.appendChild(card);
          });
        }

        // Handle category node click filter states
        function setupCategoryFiltersClickHandlers() {
          const filterButtons = document.querySelectorAll('[data-filter]');
          filterButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
              filterButtons.forEach(b => {
                b.classList.remove('border-cyan-500/30', 'bg-cyan-500/20', 'text-cyan-400');
                b.classList.add('border-white/5', 'bg-white/5', 'text-gray-400');
              });
              
              e.currentTarget.classList.remove('border-white/5', 'bg-white/5', 'text-gray-400');
              e.currentTarget.classList.add('border-cyan-500/30', 'bg-cyan-500/20', 'text-cyan-400');
              
              const targetFilter = e.currentTarget.getAttribute('data-filter');
              renderAppGridMatrix(targetFilter);
            });
          });
        }

        // Automatic Carousel Transporter Slide Loop
        let currentSlideIndex = 0;
        setInterval(() => {
          if (!heroCarouselTrack) return;
          const totalSlides = heroCarouselTrack.children.length;
          if (totalSlides <= 1) return;
          currentSlideIndex = (currentSlideIndex + 1) % totalSlides;
          heroCarouselTrack.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
        }, 5000);

        // UI Accessibility System Controls 
        const burgerBtn = document.getElementById('burger-menu-btn');
        const sidebar = document.getElementById('accessibility-sidebar');
        const gear = document.getElementById('secret-trigger-gear');
        const closeBtn = document.getElementById('close-accessibility-btn');

        if (burgerBtn && sidebar) {
          burgerBtn.addEventListener('click', () => sidebar.classList.add('open'));
        }
        if (gear && sidebar) {
          gear.addEventListener('click', (e) => { e.stopPropagation(); sidebar.classList.add('open'); });
        }
        if (closeBtn && sidebar) {
          closeBtn.addEventListener('click', () => sidebar.classList.remove('open'));
        }

        const toggleInput = document.getElementById('dark-mode-toggle');
        if (toggleInput) {
          const storedPreference = localStorage.getItem('theme') || 'dark';
          toggleInput.checked = (storedPreference === 'dark');
          if(storedPreference === 'light') document.body.classList.add('light-theme');
          
          toggleInput.addEventListener('change', (e) => {
            if (e.target.checked) {
              localStorage.setItem('theme', 'dark');
              document.body.classList.remove('light-theme');
            } else {
              localStorage.setItem('theme', 'light');
              document.body.classList.add('light-theme');
            }
          });
        }

        document.addEventListener('click', (e) => {
          if (sidebar && sidebar.classList.contains('open') && !sidebar.contains(e.target) && !gear.contains(e.target) && !burgerBtn?.contains(e.target)) {
            sidebar.classList.remove('open');
          }
        });

        document.addEventListener('DOMContentLoaded', loadRepositoryDatabase);
      })();
    </script>
  </body>
</html>
